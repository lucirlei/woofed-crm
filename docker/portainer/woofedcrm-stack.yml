version: "3.7"

# ==============================================================================
# Woofed CRM - Portainer stack (Docker Swarm, uses an EXISTING Traefik)
# ------------------------------------------------------------------------------
# Image:   douglara/woofedcrm:latest  (Rails app, Sidekiq and GoodJob workers)
# Network: network_public (external) — the same overlay network your Traefik uses
#
# Postgres + Redis + Traefik are deployed separately. This stack only registers
# routing labels so your existing Traefik picks up the web service.
#
# Matched to your Traefik:
#   - provider network : network_public
#   - entrypoint       : websecure (HTTP -> HTTPS redirect handled by Traefik)
#   - certresolver     : letsencryptresolver
#
# Portainer env vars to set:
#   WOOFED_DOMAIN   -> crm.seudominio.com
#   FRONTEND_URL    -> https://<WOOFED_DOMAIN>
#   SECRET_KEY_BASE -> openssl rand -hex 64
#   OS_SECURITY_KEY -> openssl rand -hex 32
#   DATABASE_URL / REDIS_URL / WOOFED_AI_DATABASE_URL -> your external services
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Woofed CRM - Web application (Rails / Puma) — exposed via existing Traefik
  # ----------------------------------------------------------------------------
  woofedcrm_web:
    image: douglara/woofedcrm:latest
    command: >
      bash -c "bundle exec rails db:create db:migrate db:seed --trace &&
               bundle exec puma -C config/puma.rb"
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      PORT: "80"
      # ---- Required secrets (CHANGE THESE) -----------------------------------
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-this-to-a-long-random-string}
      # ---- External Database / Redis (deployed separately) -------------------
      # Use a pgvector-enabled Postgres — the app stores vector embeddings.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/woofed_crm_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOD_JOB_EXECUTION_MODE: external
      # ---- AI agent integration ----------------------------------------------
      # OS_SECURITY_KEY is the shared bearer token between Rails and the agent.
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-please-change-me-to-a-long-random-secret}
      WOOFED_AI_URL: http://woofedcrm_ai_agent:7777
      # ---- Application config -------------------------------------------------
      LANGUAGE: pt-BR
      DEFAULT_TIMEZONE: Brasilia
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.seudominio.com}
      ENABLE_USER_SIGNUP: "false"
      STORE_URL: https://store.woofedcrm.com
      # ---- Admin (Motor Admin) -----------------------------------------------
      MOTOR_AUTH_USERNAME: ${MOTOR_AUTH_USERNAME:-lovewoofed}
      MOTOR_AUTH_PASSWORD: ${MOTOR_AUTH_PASSWORD:-lovewoofed}
      # ---- Web Push (VAPID) — generate your own keys for production ----------
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BLw6I51TymLSBO12u6Hpo3ZV_i1NF6cCaEdmeY2xCBSIA14OIQ8FnXqoF44prooqxoz_T8YNSuUs_JWzmv35BRo=}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-KSShgYVLEG5azO4uKt-APWHBZifQtwnmfTSm8rvYpQ8=}
      # ---- Optional integrations (uncomment / fill as needed) ----------------
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # EVOLUTION_API_ENDPOINT: ${EVOLUTION_API_ENDPOINT}
      # EVOLUTION_API_ENDPOINT_TOKEN: ${EVOLUTION_API_ENDPOINT_TOKEN}
      # SMTP_ADDRESS: smtp.example.com
      # SMTP_PORT: "587"
      # SMTP_USERNAME: your_username
      # SMTP_PASSWORD: your_password
      # MAILER_SENDER_EMAIL: WoofedCRM <hi@woofedcrm.com>
    networks:
      - network_public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.woofedcrm.rule=Host(`${WOOFED_DOMAIN:-crm.seudominio.com}`)"
        - "traefik.http.routers.woofedcrm.entrypoints=websecure"
        - "traefik.http.routers.woofedcrm.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.woofedcrm.loadbalancer.server.port=80"
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Woofed CRM - Sidekiq worker (short async jobs)
  # ----------------------------------------------------------------------------
  woofedcrm_sidekiq:
    image: douglara/woofedcrm:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - woofedcrm_web
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-this-to-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/woofed_crm_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LANGUAGE: pt-BR
      DEFAULT_TIMEZONE: Brasilia
    networks:
      - network_public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Woofed CRM - GoodJob worker (long-running / scheduled jobs)
  # ----------------------------------------------------------------------------
  woofedcrm_goodjob:
    image: douglara/woofedcrm:latest
    command: bundle exec good_job
    depends_on:
      - woofedcrm_web
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-this-to-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/woofed_crm_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOD_JOB_EXECUTION_MODE: external
      LANGUAGE: pt-BR
      DEFAULT_TIMEZONE: Brasilia
    networks:
      - network_public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Woofed CRM - AI agent (agno / AgentOS, Python 3.12)
  # ------------------------------------------------------------------------------
  # NOTE: Docker Swarm does NOT build images from a Dockerfile. To run this in
  # Swarm, publish the image first and replace `build:` with `image:`:
  #   docker build -f Dockerfile.ai_agent -t YOUR_REGISTRY/woofed-agent:latest .
  #   docker push YOUR_REGISTRY/woofed-agent:latest
  #
  # Internal-only by default. Uncomment the labels to publish at agent.<domain>.
  # ----------------------------------------------------------------------------
  woofedcrm_ai_agent:
    # image: YOUR_REGISTRY/woofed-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.ai_agent
    depends_on:
      - woofedcrm_web
    environment:
      # Public URL of the Rails app — the agent calls <FRONTEND_URL>/mcp
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.seudominio.com}
      # agno Postgres URL (psycopg) — external Postgres, deployed separately.
      WOOFED_AI_DATABASE_URL: ${WOOFED_AI_DATABASE_URL:-postgresql+psycopg://postgres:password@postgres:5432/woofed_ai_production}
      # Static bearer token every API caller must send (shared with Rails).
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-please-change-me-to-a-long-random-secret}
      PYTHONUNBUFFERED: "1"
    networks:
      - network_public
    deploy:
      # labels:
      #   - "traefik.enable=true"
      #   - "traefik.docker.network=network_public"
      #   - "traefik.http.routers.woofedagent.rule=Host(`agent.${WOOFED_DOMAIN:-seudominio.com}`)"
      #   - "traefik.http.routers.woofedagent.entrypoints=websecure"
      #   - "traefik.http.routers.woofedagent.tls.certresolver=letsencryptresolver"
      #   - "traefik.http.services.woofedagent.loadbalancer.server.port=7777"
      resources:
        limits:
          cpus: "1"
          memory: 1024M

networks:
  network_public:
    external: true
    name: network_public
