version: "3.7"

# ==============================================================================
# Woofed CRM - Portainer stack (with Traefik)
# ------------------------------------------------------------------------------
# Image:   douglara/woofedcrm:latest  (Rails app, Sidekiq and GoodJob workers)
# Network: public_network (external)
#
# PostgreSQL and Redis are NOT part of this stack — they are deployed separately.
# Point the *_HOST / *_URL variables below at your existing Postgres and Redis.
#
# The AI agent (agno / AgentOS) is NOT part of the douglara/woofedcrm image, so
# it is built from this repository's Dockerfile.ai_agent. Deploy this stack from
# the Git repository in Portainer so the build context resolves to the repo root.
#
# Routing is handled by Traefik (included below) via Docker provider labels.
#
# Before deploying:
#   1. Create the external network (once):
#        docker network create --driver overlay --attachable public_network
#        (standalone / non-Swarm: docker network create public_network — and
#         remove the deploy: blocks below, they are ignored outside Swarm)
#   2. Set these environment variables in the Portainer stack UI:
#        SECRET_KEY_BASE   -> openssl rand -hex 64
#        OS_SECURITY_KEY   -> openssl rand -hex 32  (shared by app + AI agent)
#        WOOFED_DOMAIN     -> public domain, e.g. crm.seudominio.com
#        FRONTEND_URL      -> https://<WOOFED_DOMAIN>
#        ACME_EMAIL        -> email for Let's Encrypt registration
#        DATABASE_URL / REDIS_URL / WOOFED_AI_DATABASE_URL -> your external services
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Traefik - reverse proxy / TLS termination (Let's Encrypt)
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=public_network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP traffic to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt (HTTP-01 challenge)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ----------------------------------------------------------------------------
  # Woofed CRM - Web application (Rails / Puma)
  # ----------------------------------------------------------------------------
  woofedcrm_web:
    image: douglara/woofedcrm:latest
    command: >
      bash -c "bundle exec rails db:create db:migrate db:seed --trace &&
               bundle exec puma -C config/puma.rb"
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      PORT: "80"
      # ---- Required secrets (CHANGE THESE) -----------------------------------
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-this-to-a-long-random-string}
      # ---- External Database / Redis (deployed separately) -------------------
      # Use a pgvector-enabled Postgres — the app stores vector embeddings.
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/woofed_crm_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOD_JOB_EXECUTION_MODE: external
      # ---- AI agent integration ----------------------------------------------
      # OS_SECURITY_KEY is the shared bearer token between Rails and the agent.
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-please-change-me-to-a-long-random-secret}
      WOOFED_AI_URL: http://woofedcrm_ai_agent:7777
      # ---- Application config -------------------------------------------------
      LANGUAGE: pt-BR
      DEFAULT_TIMEZONE: Brasilia
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.seudominio.com}
      ENABLE_USER_SIGNUP: "false"
      STORE_URL: https://store.woofedcrm.com
      # ---- Admin (Motor Admin) -----------------------------------------------
      MOTOR_AUTH_USERNAME: ${MOTOR_AUTH_USERNAME:-lovewoofed}
      MOTOR_AUTH_PASSWORD: ${MOTOR_AUTH_PASSWORD:-lovewoofed}
      # ---- Web Push (VAPID) — generate your own keys for production ----------
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BLw6I51TymLSBO12u6Hpo3ZV_i1NF6cCaEdmeY2xCBSIA14OIQ8FnXqoF44prooqxoz_T8YNSuUs_JWzmv35BRo=}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-KSShgYVLEG5azO4uKt-APWHBZifQtwnmfTSm8rvYpQ8=}
      # ---- Optional integrations (uncomment / fill as needed) ----------------
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # EVOLUTION_API_ENDPOINT: ${EVOLUTION_API_ENDPOINT}
      # EVOLUTION_API_ENDPOINT_TOKEN: ${EVOLUTION_API_ENDPOINT_TOKEN}
      # SMTP_ADDRESS: smtp.example.com
      # SMTP_PORT: "587"
      # SMTP_USERNAME: your_username
      # SMTP_PASSWORD: your_password
      # MAILER_SENDER_EMAIL: WoofedCRM <hi@woofedcrm.com>
    networks:
      - public_network
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.woofedcrm.rule=Host(`${WOOFED_DOMAIN:-crm.seudominio.com}`)"
        - "traefik.http.routers.woofedcrm.entrypoints=websecure"
        - "traefik.http.routers.woofedcrm.tls.certresolver=letsencrypt"
        - "traefik.http.services.woofedcrm.loadbalancer.server.port=80"
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Woofed CRM - Sidekiq worker (short async jobs)
  # ----------------------------------------------------------------------------
  woofedcrm_sidekiq:
    image: douglara/woofedcrm:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - woofedcrm_web
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-this-to-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/woofed_crm_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LANGUAGE: pt-BR
      DEFAULT_TIMEZONE: Brasilia
    networks:
      - public_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Woofed CRM - GoodJob worker (long-running / scheduled jobs)
  # ----------------------------------------------------------------------------
  woofedcrm_goodjob:
    image: douglara/woofedcrm:latest
    command: bundle exec good_job
    depends_on:
      - woofedcrm_web
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-this-to-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@postgres:5432/woofed_crm_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOD_JOB_EXECUTION_MODE: external
      LANGUAGE: pt-BR
      DEFAULT_TIMEZONE: Brasilia
    networks:
      - public_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Woofed CRM - AI agent (agno / AgentOS, Python 3.12)
  # ------------------------------------------------------------------------------
  # Built from Dockerfile.ai_agent (NOT in the douglara/woofedcrm image).
  # Exposes the AgentOS API on :7777 and talks back to Rails at <FRONTEND_URL>/mcp.
  # The model + api key are configured at runtime in Rails (Settings -> AI Assistant).
  # Internal-only by default (no Traefik router). Uncomment the labels below to
  # publish it at agent.<domain> if you need external access to the AgentOS API.
  # ----------------------------------------------------------------------------
  woofedcrm_ai_agent:
    build:
      context: .
      dockerfile: Dockerfile.ai_agent
    depends_on:
      - woofedcrm_web
    environment:
      # Public URL of the Rails app — the agent calls <FRONTEND_URL>/mcp
      FRONTEND_URL: ${FRONTEND_URL:-https://crm.seudominio.com}
      # agno Postgres URL (psycopg) — external Postgres, deployed separately.
      WOOFED_AI_DATABASE_URL: ${WOOFED_AI_DATABASE_URL:-postgresql+psycopg://postgres:password@postgres:5432/woofed_ai_production}
      # Static bearer token every API caller must send (shared with Rails).
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-please-change-me-to-a-long-random-secret}
      PYTHONUNBUFFERED: "1"
    networks:
      - public_network
    deploy:
      # labels:
      #   - "traefik.enable=true"
      #   - "traefik.http.routers.woofedagent.rule=Host(`agent.${WOOFED_DOMAIN:-seudominio.com}`)"
      #   - "traefik.http.routers.woofedagent.entrypoints=websecure"
      #   - "traefik.http.routers.woofedagent.tls.certresolver=letsencrypt"
      #   - "traefik.http.services.woofedagent.loadbalancer.server.port=7777"
      resources:
        limits:
          cpus: "1"
          memory: 1024M

volumes:
  traefik_letsencrypt:
    external: false

networks:
  public_network:
    external: true
